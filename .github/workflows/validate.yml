name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/validate_package.py
      - run: python -m unittest discover -s plugins/tests -p 'test_*.py'
      - run: node --test plugins/tests/video-clipping-discovery.test.mjs
      - run: node --test plugins/yaps-memory/tests/*.test.mjs
      - run: python scripts/build_submission_bundles.py
      - run: python scripts/test_archive_journey.py
